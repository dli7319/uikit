name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.76-dli.2)'
        required: true
        type: string

# Trusted publishing (npm OIDC): no NPM_TOKEN needed. The publish
# authenticates via the trusted-publisher config bound to this workflow.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update npm (trusted publishing support)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm --filter @david18284/uikit run generate
          pnpm --filter @david18284/uikit run build

      - name: Prepare publish manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # fallback (e.g. re-run without ref change): version in package.json
            VERSION="$(node -p "require('./packages/uikit/package.json').version")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION"
          # Inline the publishConfig remapping (main/exports): npm 13 stops
          # honoring publishConfig field overrides, and provenance wants the
          # final manifest to be correct as published.
          node -e '
            const fs = require("fs");
            const p = "packages/uikit/package.json";
            const d = JSON.parse(fs.readFileSync(p, "utf8"));
            if (process.argv[1]) d.version = process.argv[1];
            d.main = "dist/index.js";
            d.exports = { ".": "./dist/index.js", "./webgpu": "./dist/webgpu/index.js" };
            delete d.publishConfig;
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");
          ' "$VERSION"

      - name: Publish to npm
        working-directory: packages/uikit
        run: |
          if npm view "@david18284/uikit@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm — skipping publish."
          else
            # --tag is required: npm refuses to publish prerelease versions
            # (e.g. 1.0.76-dli.2) without an explicit dist-tag.
            npm publish --access public --tag latest
          fi
